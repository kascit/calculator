<!DOCTYPE html>
<html lang="en" data-theme="dark" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator — Sleek Glassmorphism Web Calculator | dhanur.me</title>
    <meta name="description" content="A sleek, modern glassmorphic web calculator with responsive keyboard support and clean arithmetic evaluations on dhanur.me." />
    <link rel="canonical" href="https://dhanur.me/stuff/calculator/" />
    <link rel="icon" href="https://dhanur.me/favicon.ico" />

    <!-- Styling -->
    <link rel="stylesheet" href="https://dhanur.me/css/font-awesome.min.css" />
    <link rel="stylesheet" href="https://dhanur.me/css/dui.css" />

    <!-- 1. The Configuration Object -->
    <script>
    window.SiteNavConfig = {
        mode: "navbar",
        nav: [
            { name: "Home", url: "https://dhanur.me/", icon: "fa-solid fa-house" },
            { name: "Stuff", url: "https://dhanur.me/stuff/", icon: "fa-solid fa-shapes" }
        ],
        sidebarNav: [],
        activePath: "/stuff/calculator/",
        badge: { text: "TOOL", class: "badge-accent" },
        showSearch: false,
        showAppsGrid: true,
        showThemeToggle: true,
        showAccountButton: true,
        enablePwa: false,
        favicon: false
    };
    </script>
    <script src="https://dhanur.me/js/shell.min.js" defer></script>
</head>
<body class="min-h-screen bg-base-100 text-base-content antialiased">
    <header id="dhanur-shell"></header>

    <main class="w-full max-w-sm mx-auto p-4 flex flex-col items-center justify-center min-h-[calc(100vh-8rem)]">
        <!-- Breadcrumbs -->
        <div class="w-full flex items-center justify-between text-xs text-base-content/60 mb-3 px-1">
            <div class="flex items-center gap-2">
                <a href="https://dhanur.me/" class="hover:text-base-content no-underline">Home</a>
                <span>/</span>
                <a href="/stuff/" class="hover:text-base-content no-underline">Stuff</a>
                <span>/</span>
                <span class="text-base-content font-medium">Calculator</span>
            </div>
            <a href="/stuff/" class="hover:text-primary no-underline flex items-center gap-1 text-[11px]">
                <i class="fa-solid fa-grid-2"></i> All Tools
            </a>
        </div>

        <h1 class="sr-only">Calculator — Glassmorphism Web Calculator</h1>

        <div class="dui-surface w-full shadow-lg border border-base-content/10 rounded-2xl overflow-hidden backdrop-blur-xl">
            <div class="dui-surface-body p-6">
                <!-- Display -->
                <div class="bg-base-200/60 rounded-xl p-4 flex flex-col justify-end items-end h-24 mb-4 border border-base-content/5 shadow-inner">
                    <div id="subdisplay" class="text-xs font-mono text-base-content/40 h-4 overflow-hidden"></div>
                    <span id="display" class="font-mono text-4xl font-bold tracking-tight text-base-content overflow-hidden text-right w-full">0</span>
                </div>

                <!-- Keypad -->
                <div class="grid grid-cols-4 gap-2">
                    <button type="button" class="dui-btn dui-btn-ghost bg-base-content/10 col-span-2 font-bold" onclick="clearDisplay()">AC</button>
                    <button type="button" class="dui-btn dui-btn-ghost bg-base-content/10 font-bold" onclick="appendOp('/')">÷</button>
                    <button type="button" class="dui-btn bg-info/20 text-info font-bold" onclick="appendOp('*')">×</button>

                    <button type="button" class="dui-btn dui-btn-ghost font-medium text-lg" onclick="appendNum('7')">7</button>
                    <button type="button" class="dui-btn dui-btn-ghost font-medium text-lg" onclick="appendNum('8')">8</button>
                    <button type="button" class="dui-btn dui-btn-ghost font-medium text-lg" onclick="appendNum('9')">9</button>
                    <button type="button" class="dui-btn bg-info/20 text-info font-bold" onclick="appendOp('-')">-</button>

                    <button type="button" class="dui-btn dui-btn-ghost font-medium text-lg" onclick="appendNum('4')">4</button>
                    <button type="button" class="dui-btn dui-btn-ghost font-medium text-lg" onclick="appendNum('5')">5</button>
                    <button type="button" class="dui-btn dui-btn-ghost font-medium text-lg" onclick="appendNum('6')">6</button>
                    <button type="button" class="dui-btn bg-info/20 text-info font-bold" onclick="appendOp('+')">+</button>

                    <button type="button" class="dui-btn dui-btn-ghost font-medium text-lg" onclick="appendNum('1')">1</button>
                    <button type="button" class="dui-btn dui-btn-ghost font-medium text-lg" onclick="appendNum('2')">2</button>
                    <button type="button" class="dui-btn dui-btn-ghost font-medium text-lg" onclick="appendNum('3')">3</button>
                    <button type="button" class="dui-btn dui-btn-primary row-span-2 font-bold text-xl" onclick="calculate()">=</button>

                    <button type="button" class="dui-btn dui-btn-ghost col-span-2 font-medium text-lg" onclick="appendNum('0')">0</button>
                    <button type="button" class="dui-btn dui-btn-ghost font-medium text-lg" onclick="appendNum('.')">.</button>
                </div>
            </div>
        </div>

        <footer class="mt-8 text-center text-xs text-base-content/40">
            <p>Part of the <a href="https://dhanur.me/" class="underline hover:text-base-content">dhanur.me</a> ecosystem</p>
        </footer>
    </main>

    <script>
        let current = '';
        const dp = document.getElementById('display');
        const sub = document.getElementById('subdisplay');
        function update() { dp.textContent = current || '0'; }
        function appendNum(n) {
            if (n === '.' && current.slice(-1) === '.') return;
            current += n;
            update();
        }
        function appendOp(o) {
            if (!current && o === '-') { current = '-'; update(); return; }
            if (!current) return;
            const last = current.trim().slice(-1);
            if (['+', '-', '*', '/'].includes(last)) {
                current = current.trim().slice(0, -1) + ' ' + o + ' ';
            } else {
                current += ' ' + o + ' ';
            }
            update();
        }
        function clearDisplay() { current = ''; sub.textContent = ''; update(); }
        function calculate() {
            if (!current) return;
            try {
                // Safe tokenizer-based evaluation without eval()
                const tokens = current.trim().split(/\s+/);
                if (!tokens.length) return;
                let res = parseFloat(tokens[0]);
                for (let i = 1; i < tokens.length; i += 2) {
                    const op = tokens[i];
                    const next = parseFloat(tokens[i + 1]);
                    if (isNaN(next)) break;
                    if (op === '+') res += next;
                    else if (op === '-') res -= next;
                    else if (op === '*') res *= next;
                    else if (op === '/') res = next !== 0 ? res / next : 'Error';
                }
                sub.textContent = current + ' =';
                current = String(Number.isFinite(res) ? Math.round(res * 1e8) / 1e8 : res);
            } catch(e) {
                current = 'Error';
            }
            update();
        }

        // Keyboard navigation
        document.addEventListener('keydown', (e) => {
            if (e.key >= '0' && e.key <= '9') appendNum(e.key);
            else if (e.key === '.') appendNum('.');
            else if (e.key === '+' || e.key === '-' || e.key === '*' || e.key === '/') appendOp(e.key);
            else if (e.key === 'Enter' || e.key === '=') { e.preventDefault(); calculate(); }
            else if (e.key === 'Backspace') {
                current = current.trim().slice(0, -1).trim();
                update();
            } else if (e.key === 'Escape') clearDisplay();
        });
    </script>
</body>
</html>
