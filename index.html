<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator | dhanur.me</title>
    <!-- Configure Nav -->
    <script>
    window.SiteNavConfig = {
        mode: "navbar",
        nav: [{ name: "Home", url: "https://dhanur.me/", icon: "fa-solid fa-house" }],
        sidebarNav: [],
        activePath: window.location.pathname,
        badge: { text: "TOOL", class: "badge-accent" },
        showSearch: false,
        showAppsGrid: true,
        showThemeToggle: true
    };
    </script>
    <script type="module" src="https://dhanur.me/js/shell.js"></script>
</head>
<body>
    <main class="w-full max-w-sm mx-auto p-4 flex flex-col items-center justify-center min-h-[calc(100vh-6rem)]">
        <div class="dui-surface w-full">
            <div class="dui-surface-body p-6">
                <!-- Display -->
                <div class="bg-base-300 rounded-xl p-4 flex justify-end items-end h-24 mb-4 shadow-inner">
                    <span id="display" class="font-mono text-4xl font-bold tracking-tight text-base-content overflow-hidden">0</span>
                </div>
                <!-- Keypad -->
                <div class="grid grid-cols-4 gap-2">
                    <button class="dui-btn dui-btn-ghost bg-base-content/10 col-span-2" onclick="clearDisplay()">AC</button>
                    <button class="dui-btn dui-btn-ghost bg-base-content/10" onclick="appendOp('/')">÷</button>
                    <button class="dui-btn bg-info/20 text-info font-bold" onclick="appendOp('*')">×</button>

                    <button class="dui-btn dui-btn-ghost" onclick="appendNum('7')">7</button>
                    <button class="dui-btn dui-btn-ghost" onclick="appendNum('8')">8</button>
                    <button class="dui-btn dui-btn-ghost" onclick="appendNum('9')">9</button>
                    <button class="dui-btn bg-info/20 text-info font-bold" onclick="appendOp('-')">-</button>

                    <button class="dui-btn dui-btn-ghost" onclick="appendNum('4')">4</button>
                    <button class="dui-btn dui-btn-ghost" onclick="appendNum('5')">5</button>
                    <button class="dui-btn dui-btn-ghost" onclick="appendNum('6')">6</button>
                    <button class="dui-btn bg-info/20 text-info font-bold" onclick="appendOp('+')">+</button>

                    <button class="dui-btn dui-btn-ghost" onclick="appendNum('1')">1</button>
                    <button class="dui-btn dui-btn-ghost" onclick="appendNum('2')">2</button>
                    <button class="dui-btn dui-btn-ghost" onclick="appendNum('3')">3</button>
                    <button class="dui-btn dui-btn-primary row-span-2 font-bold text-lg" onclick="calculate()">=</button>

                    <button class="dui-btn dui-btn-ghost col-span-2" onclick="appendNum('0')">0</button>
                    <button class="dui-btn dui-btn-ghost" onclick="appendNum('.')">.</button>
                </div>
            </div>
        </div>
    </main>

    <script>
        let current = '';
        const dp = document.getElementById('display');
        function update() { dp.textContent = current || '0'; }
        function appendNum(n) { current += n; update(); }
        function appendOp(o) { current += ' ' + o + ' '; update(); }
        function clearDisplay() { current = ''; update(); }
        function calculate() {
            try { current = eval(current).toString(); } catch(e) { current = 'Error'; }
            update();
            current = '';
        }
    </script>
</body>
</html>
